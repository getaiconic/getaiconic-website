name: Build and deploy to GitHub Pages

# Builds the prerendered site (build.mjs -> dist/) and publishes it to Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Adjust the branch below if you merge this work into a different default branch.
on:
  push:
    branches:
      - claude/responsive-website-design-koknxd
      - main
      - newwebsite
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm install --no-save playwright-core@1.48.0 playwright@1.48.0
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium
      - name: Prerender site
        run: node build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
